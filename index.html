<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AMB82-MINI 語音控制 LED</title>
  <style>
    :root { color-scheme:light; --blue:#1976d2; --ink:#142033; --muted:#607086; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,"Microsoft JhengHei",sans-serif; color:var(--ink); background:#f3f6fa; }
    main { width:min(820px,calc(100% - 28px)); margin:28px auto; }
    header { padding:24px; border-radius:18px; color:white; background:linear-gradient(135deg,#12365d,#1769c2); box-shadow:0 12px 30px #183c6622; }
    h1 { margin:0 0 6px; font-size:clamp(1.55rem,5vw,2.2rem); }
    h2 { margin:0 0 12px; font-size:1.1rem; }
    p { margin:6px 0; }
    .card { background:white; border:1px solid #dce4ed; border-radius:14px; padding:18px; margin-top:16px; box-shadow:0 4px 14px #16324f0b; }
    .row { display:flex; flex-wrap:wrap; gap:9px; align-items:center; }
    button, select { border:0; border-radius:9px; padding:10px 14px; font:inherit; font-weight:650; background:#e9eef5; color:var(--ink); }
    button { cursor:pointer; }
    button.primary { color:white; background:var(--blue); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .badge { display:inline-block; padding:4px 9px; border-radius:999px; font-size:.9rem; background:#edf1f5; }
    .lights { display:flex; gap:28px; margin:16px 0 3px; }
    .light { display:flex; align-items:center; gap:9px; font-weight:650; }
    .dot { width:22px; height:22px; border-radius:50%; background:#aeb8c2; border:2px solid white; box-shadow:0 0 0 1px #aab4be; }
    .dot.blue.on { background:#1689ff; box-shadow:0 0 16px #1689ff; }
    .dot.green.on { background:#16b95d; box-shadow:0 0 16px #16b95d; }
    .muted { color:var(--muted); }
    .error { margin:10px 0; padding:10px 12px; border:1px solid #e4a2aa; border-radius:9px; background:#fff0f2; color:#9a2632; font-weight:700; }
    .error[hidden] { display:none; }
    #transcript { font-size:1.15rem; min-height:1.7em; font-weight:650; }
    #log { margin:0; max-height:210px; overflow:auto; padding:12px; border-radius:9px; background:#101b2a; color:#cce1f7; white-space:pre-wrap; font:13px/1.55 ui-monospace,Consolas,monospace; }
    label { display:flex; gap:7px; align-items:center; }
    @media (max-width:520px) { main{margin:14px auto}.lights{flex-direction:column;gap:10px} }
  </style>
</head>
<body><main>
  <header><h1>AMB82-MINI 語音控制 LED</h1><p>說「左邊開燈」亮藍燈；說「右邊開燈」亮綠燈。</p></header>
  <section class="card">
    <h2>1. 連接開發板</h2>
    <div class="row"><button id="connect" class="primary">選擇序列埠</button><button id="disconnect" disabled>中斷連線</button><span id="connection" class="badge">未連線</span></div>
    <p class="muted">使用桌面版 Chrome 或 Edge；鮑率固定為 115200。</p>
  </section>
  <section class="card">
    <h2>2. 語音或手動控制</h2>
    <div class="row">
      <label for="language">辨識語言</label>
      <select id="language">
        <option value="zh-TW">中文（台灣）</option>
        <option value="en-US">English (US)</option>
      </select>
      <button id="listen" class="primary">開始語音辨識</button><button id="stop" disabled>停止辨識</button><label><input id="speakBack" type="checkbox" checked>語音回覆</label>
    </div>
    <p id="commandHint" class="muted">中文指令：左邊開燈／關燈、右邊開燈／關燈、全部關燈、閃爍三次。</p>
    <p>辨識結果：<span id="transcript">尚未辨識</span></p>
    <div class="row">
      <button data-command="L" disabled>藍燈開</button><button data-command="X" disabled>藍燈關</button>
      <button data-command="R" disabled>綠燈開</button><button data-command="Y" disabled>綠燈關</button>
      <button data-command="O" disabled>全部關燈</button><button data-command="B" disabled>閃爍三次</button>
    </div>
  </section>
  <section class="card">
    <h2>3. 執行回饋</h2><p id="status" role="status">請先連接開發板。</p>
    <p id="errorBanner" class="error" role="alert" hidden></p>
    <div class="lights" aria-label="由開發板回傳的 LED 實際狀態"><span class="light"><span id="blueDot" class="dot blue"></span>藍燈</span><span class="light"><span id="greenDot" class="dot green"></span>綠燈</span></div>
    <p class="muted">燈號只依據開發板回傳的 STATE 資訊更新，不以送出指令推測。</p>
  </section>
  <section class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">系統紀錄</h2>
      <div class="row">
        <button id="clearLog">重置紀錄</button>
        <button id="exportCsv">輸出 CSV</button>
      </div>
    </div>
    <p class="muted">CSV 會保存時間與完整事件，可作為驗收附件。</p>
    <pre id="log" aria-live="polite">等待操作…</pre>
  </section>
</main><script src="command-parser.js"></script><script src="app.js"></script></body>
</html>
